<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reise-Ausgaben</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;line-height:1.5}a{color:#1d4ed8;font-weight:600}</style>
<script>
try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { if (x.scope.indexOf('/beta/') >= 0) x.unregister(); }); }); } catch (e) {}
try { if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { if (n.indexOf('reisen-beta') === 0) caches.delete(n); }); }); } catch (e) {}
setTimeout(function () { location.replace('../index.html'); }, 400);
</script></head>
<body><h2>Die Beta ist jetzt die normale App</h2>
<p>Du wirst weitergeleitet. Falls nicht: <a href="../index.html">Reise-Ausgaben öffnen</a></p></body></html>
